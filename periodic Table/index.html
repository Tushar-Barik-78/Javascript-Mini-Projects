<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table</title>

    <style>
        body{
            height: 100vh;
            width: 100%;
            background-color: rgb(42, 40, 40);
            display: flex;
            /* justify-content:center; */
            align-items: center;
            flex-direction: column;
            color: aliceblue;
        }
        .mainBody{
            margin-top: 2rem;
            width: 80%;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .element{
            color: antiquewhite;
            width: 6rem;
            height: 4rem;
            border: 2px solid rgb(251, 77, 216);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.08s linear;
            &:hover{
                background-color: rgb(224, 159, 240);
                border: 2px solid rgb(69, 45, 229);
                font-size: 24px;
                width: 6.3rem;
                height: 4.3rem;
                color: rgb(7, 57, 29);


            }

        }


    </style>
</head>
<body>
    <h1>Event Delegation - Periodic Table</h1>
    <section class="mainBody"></section>

    <script>

        const mainBody = document.querySelector(".mainBody");

        const createPeriodicElement = (symbol,atomicNumber,name)=>{
            const newElement = document.createElement("div");
            newElement.classList.add("element");
            newElement.innerText = symbol;

            newElement.setAttribute("atomic_number",atomicNumber);
            newElement.setAttribute("atomic_name",name);

            return newElement;
        }
        


        //  function to initialize the table
        function initializePeriodicTable() {
            // create 50 periodic table elements
            for(let i = 1;i<=54;i++){
                const newElement = createPeriodicElement(`Elem${i}`,i,`Element ${i}`)
                mainBody.append(newElement)
            }
        }


        const handelElementClick = (event) =>{
            const t = event.target;
            if(t.classList.contains("element")){
                const atomicNumber = t.getAttribute("atomic_number");
                const atomicName = t.getAttribute("atomic_name");

                alert(`Atomic Number : ${atomicNumber} \nElement Name : ${atomicName}`);
                
            }
        }

        // Add event delegation to the parent
        mainBody.addEventListener("click",handelElementClick);

        // Initialize priodic table
        initializePeriodicTable();
    </script>
</body>
</html>
