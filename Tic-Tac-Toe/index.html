<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="newGameBox hide">
        <h1 id="winH1">Winner</h1>
        <button class="winBtn">New Game</button>
    </div>
    <h1>Tic-Tac-Toe</h1>

    <div class="container">
        <button id="b0" class="btn"></button>
        <button id="b1" class="btn"></button>
        <button id="b2" class="btn"></button>
        <button id="b3" class="btn"></button>
        <button id="b4" class="btn"></button>
        <button id="b5" class="btn"></button>
        <button id="b6" class="btn"></button>
        <button id="b7" class="btn"></button>
        <button id="b8" class="btn"></button>
    </div>

    <div class="turnBox"></div>
    <button class="resetBtn">Reset</button>
    <script src="index.js"></script>
</body>
</html>
